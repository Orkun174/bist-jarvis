# .github/workflows/daily_data.yml
# Weekdays: update prices/quality/eligibility for the whole BIST, retrain the
# model, record predictions. Saturdays: weekly recipe search.
# Everything is committed to the `data` branch.
name: Daily BIST Data

on:
  schedule:
    # GitHub's free scheduler queues jobs by hours (2026-11-21: 22:47 and 00:17
    # started at 03:58 and 05:25 TRT) and sometimes drops them altogether (the
    # 09:17 and Saturday slots that day never ran). Yahoo meanwhile drops the
    # previous session for some hours after midnight UTC. So the daily work has
    # several slots; the first that completes it wins, later ones stop after a
    # status check, and a run that lands in Yahoo's gap waits it out
    # (jarvis.config.LAG_DEADLINE_HOUR). Off-minute times avoid busy :00/:30 marks.
    - cron: "47 19 * * 1-5"   # 22:47 TRT, Mon-Fri sessions
    - cron: "17 21 * * 1-5"   # 00:17 TRT, second evening attempt
    - cron: "17 6 * * 2-6"    # 09:17 TRT next morning, last attempt before the open
    # 10:00 TRT Saturday, Sunday as backup: completes Friday if it is still
    # missing, then the weekly recipe search (once per week).
    - cron: "0 7 * * 6"
    - cron: "0 7 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = data + training, simulate = walk-forward scorecard, search = recipe search"
        type: choice
        options: [daily, simulate, search]
        default: daily
      limit:
        description: "daily only: process the first N symbols (leave empty for all)"
        required: false
        default: ""
      notify:
        description: "daily only: send the Telegram message"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: bist-daily-data
  cancel-in-progress: false

jobs:
  daily-data:
    runs-on: ubuntu-latest
    # Up to 285 min waiting for Yahoo prices plus 45 for macro series
    # (jarvis/config.py), under GitHub's 360-minute job limit.
    timeout-minutes: 355

    env:
      TZ: Europe/Istanbul
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decide what to run
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "0 7 * * 6"|"0 7 * * 0") MODE=search ;;
              *) MODE=daily ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          # The morning slot is the last chance and a manual run is deliberate:
          # both send a message even when the day could not be completed.
          if [ "${{ github.event.schedule }}" = "17 6 * * 2-6" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "last_attempt=true" >> "$GITHUB_OUTPUT"
          else
            echo "last_attempt=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Mode: $MODE"

      - name: Checkout data branch (create it when missing)
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data:refs/remotes/origin/data
            git worktree add data origin/data
            git -C data switch -C data
          else
            git worktree add --detach data
            git -C data switch --orphan data
            git -C data rm -rf --quiet . >/dev/null 2>&1 || true
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-data.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-data.txt

      - name: Run unit tests
        run: python -m pytest tests/jarvis -q

      # Search mode runs the daily work first when the last session is still
      # missing (the weekend catch-up for a Friday the scheduler dropped).
      - name: Already done today?
        id: before
        if: steps.mode.outputs.mode == 'daily' || steps.mode.outputs.mode == 'search'
        run: |
          set -euo pipefail
          python -m jarvis.status --data-dir data | tee -a "$GITHUB_OUTPUT"
          # A scheduled slot after a successful one has nothing to do.
          if grep -q '^done=true' "$GITHUB_OUTPUT" && { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ steps.mode.outputs.mode }}" = "search" ]; }; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Daily work for this session is already done; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update data
        if: (steps.mode.outputs.mode == 'daily' || steps.mode.outputs.mode == 'search') && steps.before.outputs.skip != 'true'
        run: |
          set -euo pipefail
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ]; then
            python -m jarvis.pipeline --data-dir data --limit "$LIMIT" | tee summary.json
          else
            python -m jarvis.pipeline --data-dir data | tee summary.json
          fi
          {
            echo '### Daily BIST data'
            echo '```json'
            cat summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Train and predict
        if: (steps.mode.outputs.mode == 'daily' || steps.mode.outputs.mode == 'search') && steps.before.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python -m jarvis.train --data-dir data | tee train.json
          {
            echo '### Training and predictions'
            echo '```json'
            cat train.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Simulated scorecard
        if: steps.mode.outputs.mode == 'simulate'
        run: |
          set -euo pipefail
          python -m jarvis.train --data-dir data --simulate | tee simulate.json
          {
            echo '### Simulated scorecard (not live results)'
            echo '```json'
            cat simulate.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Weekly recipe search
        if: steps.mode.outputs.mode == 'search'
        run: |
          set -euo pipefail
          # The Sunday backup has nothing to do when Saturday already searched.
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/models/search/${{ steps.before.outputs.session }}.json" ]; then
            echo "Recipe search for ${{ steps.before.outputs.session }} already done." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m jarvis.train --data-dir data --search | tee search.json
          {
            echo '### Recipe search'
            echo '```json'
            cat search.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Refresh the simulated scorecard with the (possibly new) recipe.
          python -m jarvis.train --data-dir data --simulate

      - name: Commit and push data
        run: |
          set -euo pipefail
          cd data
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          git commit --quiet -m "data: $(date +%F) (${{ steps.mode.outputs.mode }})"
          git push origin HEAD:data

      - name: Result ready?
        id: after
        if: (steps.mode.outputs.mode == 'daily' || steps.mode.outputs.mode == 'search') && steps.before.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python -m jarvis.status --data-dir data | tee -a "$GITHUB_OUTPUT"
          # A run that is still without a result in the morning or daytime has
          # waited out Yahoo's gap in vain; later slots may never come (GitHub
          # drops some), so it says why there is no result.
          HOUR=$((10#$(date +%H)))
          if grep -q '^done=false' "$GITHUB_OUTPUT" && [ "$HOUR" -ge 8 ] && [ "$HOUR" -lt 18 ]; then
            echo "gave_up=true" >> "$GITHUB_OUTPUT"
          fi

      # Message only when the day produced a result, or when no later slot is
      # to be counted on (then it says why there is none). Earlier failed
      # evening slots stay silent.
      - name: Send Telegram message
        if: >-
          (steps.mode.outputs.mode == 'daily' || steps.mode.outputs.mode == 'search')
          && steps.before.outputs.skip != 'true'
          && github.event.inputs.notify != 'false'
          && (steps.after.outputs.done == 'true' || steps.mode.outputs.last_attempt == 'true' || steps.after.outputs.gave_up == 'true')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m jarvis.notify --data-dir data
